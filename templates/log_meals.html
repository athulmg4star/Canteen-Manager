<!DOCTYPE html>
<html lang="en">
<head>
<script src="/static/preferences.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Daily Meals</title>
    <script src="/static/vendor/tailwind-3.4.17.js"></script>
    <script src="/static/vendor/lucide-0.468.0.js"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<meta name="csrf-token" content="{{ csrf_token }}"><meta name="submission-token" content="{{ submission_token() }}"><script src="{{ url_for('static', filename='app.js') }}"></script><link rel="stylesheet" href="/static/features.css"></head>
<body class="flex h-screen text-slate-800">

    {% include 'sidebar.html' %}

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-8 shrink-0">
            <h1 class="text-xl font-semibold">Daily Consumption Entry</h1>
        </header>

        <div class="p-8 max-w-3xl">
            {% if success %}
            <div class="mb-6 bg-green-50 text-green-700 p-4 rounded-lg flex items-center border border-green-200">
                <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
                Entry saved successfully to the database!
            </div>
            {% endif %}

            <form action="/log-meals" method="POST" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="submission_token" value="{{ submission_token() }}">
                
                <div class="grid grid-cols-2 gap-6 mb-8 border-b border-slate-100 pb-8">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input type="date" name="log_date" required id="datePicker" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Select Employee</label>
                        <select name="employee_id" required class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">-- Choose Staff Member --</option>
                            {% for emp in employees %}
                            <option value="{{ emp[0] }}">{{ emp[1] }} ({{ emp[2] }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h3 class="font-medium text-slate-900 mb-4">Enter Quantities Consumed</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                    {% for item in items %}
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">{{ item[1] }} (₹{{ "%.0f"|format(item[2]) }})</label>
                        <input type="number" name="qty_{{ item[1] }}" min="0" placeholder="0" class="w-full border border-slate-300 rounded bg-white px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    {% endfor %}
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg shadow-sm hover:bg-indigo-700 font-medium">Save Entry</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.getElementById('datePicker').value = localISODate();
        // Universal Prevent Double Submit Logic
        document.addEventListener('submit', function(e) {
            const form = e.target;
            // Use the button that was ACTUALLY clicked (e.submitter), not just
            // "the first submit button in the form" -- some pages have more
            // than one submit button in the same form.
            const submitBtn = e.submitter || form.querySelector('button[type="submit"]');
            
            if (submitBtn) {
                // If the button is already disabled, stop the form from submitting again
                if (submitBtn.disabled) {
                    e.preventDefault();
                    return;
                }
                
                // Disable the button and change the text
                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin inline"></i> Processing...';
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                // Safety fallback: Re-enable the button after 4 seconds just in case the server hangs
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 4000);
            }
        });
    </script>
{% include 'features/command.html' %}<script src="/static/features.js" defer></script></body>
</html>
